[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-experiments"
version = "0.1.0"
description = "Top-K recommendation on MovieLens: Popularity vs ItemKNN vs EASE vs BPR-MF under one protocol"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GoYoungJune" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "torch",
    "matplotlib",
    "tabulate",
]

[project.optional-dependencies]
dev = ["pytest"]
# part 2: ONNX export, int8 quantization, FastAPI demo (fastapi < 0.162 avoids an opentelemetry-api bump)
serving = ["onnx", "onnxruntime", "fastapi<0.162", "uvicorn", "httpx"]
# search reranking: models are pulled from the Hugging Face Hub on first run (about 10 GB)
search = ["pyarrow", "scikit-learn", "sentence-transformers", "transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
